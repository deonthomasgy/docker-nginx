# Default configuration of princeamd/nginx: the nginx.org layout plus the
# Bitnami-compatible paths. Mount your own over /opt/bitnami/nginx/conf/nginx.conf
# (/etc/nginx/nginx.conf is the same file).

# load_module /usr/lib/nginx/modules/ngx_http_perl_module.so;
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
# load_module /usr/lib/nginx/modules/ngx_http_modsecurity_module.so;

user  nginx;
worker_processes  auto;

error_log  /opt/bitnami/nginx/logs/error.log notice;
pid        /opt/bitnami/nginx/tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    variables_hash_max_size 2048;
    variables_hash_bucket_size 128;
    server_names_hash_max_size 2048;
    server_names_hash_bucket_size 256;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /opt/bitnami/nginx/logs/access.log  main;

    sendfile           on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
    include /opt/bitnami/nginx/conf/server_blocks/*.conf;
}
