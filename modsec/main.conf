# Default ModSecurity rules file: the engine settings above plus the OWASP
# Core Rule Set at paranoia level 1 (crs-setup.conf). Point
# modsecurity_rules_file here, or copy this file to add your own exclusions
# around the rules (see README.md).
Include /etc/nginx/modsec/modsecurity.conf
Include /etc/nginx/modsec/crs/crs-setup.conf
Include /etc/nginx/modsec/crs/rules/*.conf
