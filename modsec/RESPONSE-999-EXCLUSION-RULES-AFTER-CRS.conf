# Exceptions for normal traffic of the platforms behind our proxy that take a
# target out of a rule for good (SecRuleUpdateTarget*). The image copies this
# file into crs/rules/, where it sorts after every Core Rule Set file, the
# Core Rule Set's place for these (libmodsecurity 3 applies them wherever they
# load), so a config that includes crs/rules/*.conf loads it, the proxy's
# main.conf included. On the proxy, exceptions for one platform (its host, or a
# path on it) go in includes/modsec/exclusions-before-crs.conf, rules switched
# off everywhere in exclusions-after-crs.conf.

# MCP tool calls from Claude Code through the Claude connectors (Mintage's
# /api/v1.0/m2m/agent-gateway/mcp) carry the tool-use id under params._meta as
# "claudecode/toolUseId". The JSON body parser names that argument
# json.params._meta.claudecode/toolUseId, and rule 930120 (OS File Access
# Attempt) finds ".claude" (lfi-os-files.data) in the name, so every such call
# was flagged. Only this argument name leaves 930120: its value, and every other
# name and value, are still inspected. The exact name is on purpose: a regex
# exclusion in libmodsecurity 3 also drops the values of the keys it matches,
# in every collection.
SecRuleUpdateTargetById 930120 "!ARGS_NAMES:json.params._meta.claudecode/toolUseId"
