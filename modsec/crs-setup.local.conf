
# -- princeamd/nginx ----------------------------------------------------------
# Settings that differ from crs-setup.conf.example, appended to it when the
# image is built (see the Dockerfile), so every config that includes
# crs/crs-setup.conf gets them, the proxy's included. Exceptions for one
# platform (its host, or a path on it) belong in the including config instead
# (on the proxy: includes/modsec/exclusions-before-crs.conf).

# HTTP methods. The Core Rule Set allows GET HEAD POST OPTIONS and flags other
# methods with rule 911100 ("Method is not allowed by policy", CRITICAL,
# anomaly score 5 = the blocking threshold on its own). The platforms behind the
# proxy are REST APIs: PUT, PATCH and DELETE are their normal writes (settings,
# rosters, loans, tickets, and TimeKeeper's settings push through Workforce to
# Mintage every minute), so the default flagged ~1,200 requests an hour while
# watching and would refuse them all (403) once blocking is on. Real methods
# outside the list (PROPFIND, MKCOL…) are still flagged; nginx itself refuses
# TRACE and CONNECT before the firewall runs.
SecAction \
    "id:900200,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    tag:'OWASP_CRS',\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"
