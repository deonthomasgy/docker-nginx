# Exceptions for normal traffic of the platforms behind our proxy that must run
# before the Core Rule Set's rules: ctl actions that change the rules for one
# request. The image copies this file into crs/rules/, where it sorts before
# REQUEST-901-INITIALIZATION, so a config that includes crs/rules/*.conf loads
# it first, the proxy's main.conf included. Ids 10000-10999, in ModSecurity's
# local range (Log Tracker's exceptions use 1000000-1999999). Exceptions for one
# platform (its host, or a path on it) go in the proxy's
# includes/modsec/exclusions-before-crs.conf.

# Face photos sent with a clock-in, POST .../biometric/clock on TimeKeeper and
# Workforce (kiosks and Connect self-service): "b64:" plus base64 from the
# kiosks, plain base64 from the Connect app, a data: URL from the Workforce web
# app. Base64 is letters, digits, "+", "/" and "=", so now and then it contains
# a Unix shell path such as "bin/w" (932160) or an OS file name such as "/tmp/"
# (930120), and a data: URL trips the command execution rules (932235, 932260:
# ";base64" reads as a shell command), the data scheme rule (934170) and the
# XSS rules (941130, 941170) every time. On these paths face_image leaves the
# ARGS targets of every Core Rule Set rule; the rest of the request is inspected
# as usual. Rules that read the raw body, such as 921110 and 944100-944130,
# still see the photo without tripping on it, and so would the length checks
# 920370 and 920390 if tx.arg_length or tx.total_arg_length were set.
SecRule REQUEST_FILENAME "@endsWith /biometric/clock" \
    "id:10100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.face_image"
